; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
custom_project_name = BLLC
custom_project_codename = Balder
custom_version = 3.0.0 #BLLC_[Major].[Minor].[Patch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv
build_flags = 
	-DVERSION=${this.custom_version}
	-DSTRVERSION=\""${this.custom_version}"\"
	-DCONFIG_ASYNC_TCP_STACK_SIZE=4096
	-DCORE_DEBUG_LEVEL=0
extra_scripts = 
	pre:pre_build.py
	merge_firmware.py
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	knolleary/PubSubClient@^2.8.0
	https://github.com/luc-github/ESP32SSDP.git#2.0.3
	ESP32Async/AsyncTCP@^3.4.0
	ESP32Async/ESPAsyncWebServer@^3.7.0
	mathieucarbou/MycilaWebSerial@^8.1.1
